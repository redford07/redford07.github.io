<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WooChan OS — 김우찬 포트폴리오</title>
  <link rel="stylesheet" href="assets/retro/desktop.css">
</head>
<body>
  <main id="desktop" aria-label="WooChan OS 바탕 화면">
    <div class="desktop-icons" aria-label="앱 바로가기">
      <button data-app="welcome"><span class="pixel-icon computer" aria-hidden="true"></span>My Computer</button>
      <button data-app="about"><span class="pixel-icon document" aria-hidden="true"></span>About Me</button>
      <button data-app="experience"><span class="pixel-icon folder" aria-hidden="true"></span>Experience</button>
      <button data-app="projects"><span class="pixel-icon folder" aria-hidden="true"></span>Projects</button>
      <button data-app="education"><span class="pixel-icon document" aria-hidden="true"></span>Education</button>
      <button data-app="gallery"><span class="pixel-icon picture" aria-hidden="true"></span>My Pictures</button>
      <button data-app="contact"><span class="pixel-icon mail" aria-hidden="true"></span>Contact</button>
    </div>
    <div class="wallpaper-mark" aria-hidden="true"><strong>WooChan<span>OS</span></strong><small>PERSONAL WORKSTATION</small></div>
    <div id="windows"></div>
  </main>
  <nav id="start-menu" aria-label="시작 메뉴" hidden><div class="start-brand">WooChan<span>OS</span></div><div class="start-items"><button data-app="welcome">My Computer</button><button data-app="about">About Me</button><button data-app="experience">Experience</button><button data-app="projects">Projects</button><button data-app="skills">Skills</button><button data-app="education">Education & Awards</button><button data-app="gallery">My Pictures</button><button data-app="contact">Contact</button><a href="index.html" target="_top">3D 작업실로 돌아가기</a></div></nav>
  <footer class="taskbar"><button id="start-button" aria-expanded="false" aria-controls="start-menu"><span class="start-symbol" aria-hidden="true">▦</span> Start</button><div id="tasks" aria-label="열린 창"></div><time id="clock"></time></footer>
  <template id="window-template"><section class="os-window" role="dialog" tabindex="-1"><header class="titlebar"><span class="window-title"></span><div class="window-controls"><button data-action="minimize" aria-label="최소화">_</button><button data-action="maximize" aria-label="최대화">□</button><button data-action="close" aria-label="닫기">×</button></div></header><nav class="window-menu" aria-label="창 메뉴"><button data-action="home">Home</button><button data-action="back">Back</button><button data-action="contact">Contact</button></nav><div class="address-bar"><span>Address</span><span class="address-path"></span></div><div class="window-content"></div><footer class="window-status"><span>Done</span><span>WooChan OS</span></footer></section></template>
  <noscript><p class="noscript"><a href="save.html" target="_top">기본 포트폴리오 보기</a></p></noscript>
  <script src="assets/retro/content.js"></script>
  <script src="assets/retro/desktop.js"></script>
</body>
</html>
